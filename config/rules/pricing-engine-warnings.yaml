# Team Pricing: log lines from pricing-engine at WARN or above -> UI only;
# group them into one alert per instrument every 5 minutes.
# `group` keys the incident by instrument + UTC 5-minute bucket, so each
# instrument gets one digest alert per window whose count grows live.
# Digests resolve themselves after 10 quiet minutes.
id: pricing-engine-warnings
name: Pricing engine warnings
team: pricing
when:
  all:
    - { path: fields.service, op: eq, value: pricing-engine }
    - { path: fields.severity_rank, op: gte, value: 2 }
route:
  - to: team:pricing
    channels: [ui]
present:
  title: "pricing-engine {{ fields.severity }} on {{ fields.instrument }}"
  body: "{{ raw.msg }}"
  fields:
    - { path: fields.instrument, label: Instrument }
    - { path: raw.msg, label: Message }
group:
  by: [fields.instrument]
  window: 5m
auto_resolve:
  quiet_for: 10m
