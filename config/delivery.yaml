# Delivery settings (crates/beacon-delivery/src/config.rs, DeliverySettings).
# One-hop fallback: when a job finally fails (permanent error or retries exhausted), exactly one
# job on the fallback channel is created for the same person (SPEC §5.6). A fallback job never
# falls back again.
channels:
  phone: { fallback: sms }
  sms:   { fallback: email }
  email: {}
