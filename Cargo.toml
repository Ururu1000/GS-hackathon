[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"
rust-version = "1.89"

[workspace.dependencies]
# Versions per docs/SPEC.md §3.
tokio = { version = "1.54", features = ["full"] }
sqlx = { version = "=0.8.6", default-features = false, features = ["postgres", "runtime-tokio", "migrate", "json", "uuid", "chrono", "macros"] }
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1", "pool", "hostname"] }
reqwest = { version = "0.12", default-features = false, features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-saphyr = "2.2"
uuid = { version = "1", features = ["v4", "v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
rand = "0.9"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
# Added by ingest/engine (a).
axum = "0.8.9"
rdkafka = { version = "0.39", features = ["cmake-build", "tokio"] }
minijinja = "2"
regex = "1"
sha2 = "0.10"
hex = "0.4"
humantime-serde = "1"
clap = { version = "4", features = ["derive", "env"] }
futures = "0.3"
hdrhistogram = "7.5"
# Added by delivery (b), M4.
chrono-tz = "0.10"
tokio-stream = { version = "0.1", features = ["sync"] }
