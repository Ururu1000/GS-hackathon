openapi: 3.1.0
info:
  title: Beacon UI API
  version: 0.2.0
  description: |
    The part of the Beacon API that the React UI depends on (spec §8). Draft for
    M0, proposed by the UI (erop-laptop/claude) for the backend to adopt.
    The TypeScript mirror is `ui/src/api/types.ts`; the SSE fixtures are in
    `ui/contract/fixtures/`. The dev mock (`ui/mock/`) implements this file.

    ## Conventions
    - **Timestamps:** RFC 3339 in UTC with millisecond precision and a `Z`
      suffix, e.g. `2026-10-23T09:14:02.331Z`.
    - **Field names:** snake_case. Enums are lower-case strings.
    - **Alert `version`:** a per-alert, strictly increasing integer. Every
      visible change (count bump, status change, re-render) bumps it. There is
      no global ordering across alerts.
    - **Feed order:** keyset `(first_seen, id)`, newest first. `first_seen`
      never changes, so rows never move once shown.
    - **Auth:** a same-origin session cookie (works with EventSource). Writes
      must send `X-CSRF-Token` with the token from `GET /api/session`. M0 may
      run with a fixed demo session.
    - **Authorization & privacy:** every read and write is scoped server-side
      to the session's authorized teams and roles (`403 forbidden` otherwise).
      - `PUT /api/people/{personId}/preferences`: self or admin only.
      - `PUT /api/teams/{teamId}`: team lead or admin only (prevents self-promotion).
      - `POST/PUT/DELETE /api/rules`, `POST /api/proposals/{id}/{decision}`,
        `POST /api/alerts/{id}/steps/{step}/{run|check}`: owning team member or admin.
      - `POST /api/approvals/{id}/{decision}`: eligible approver only; requester
        cannot self-approve when separation of duties applies.
      - SMS approval challenges are stored hashed and delivered out-of-band
        only; plaintext `sms_code` is never returned in API responses.
      - Contact details and personal schedules are omitted/redacted for other
        users; `DeliveryStatus.address` is masked; `EventSample.raw`, runbook
        params, execution outputs, and audit timeline entries are redacted
        server-side (no secrets or raw PII).
    - **Errors:** every non-2xx body is an `ApiError`. Internal `5xx` errors
      return generic messages with no stack traces or internal paths.

    ## SSE (`GET /api/stream`)
    MVP recovery is a snapshot on every (re)connect, without `Last-Event-ID`:
    1. The server subscribes and buffers live updates first, then reads the
       authorized feed page from Postgres.
    2. It sends `event: snapshot`, which **replaces** the client's page.
    3. It drains the buffer, then streams `alert.upsert` (the full absolute
       `FeedAlert`, never a delta) and `alert.remove`.
    4. The client drops any upsert whose `version` is <= the version it holds
       for that alert, or <= a removal version it saw for that id.
    5. On overflow, a consumer gap or a rebalance the server closes the stream;
       the browser reconnects (to any replica) and gets a fresh snapshot.
    6. The server sends a `: ping` comment at least every 15 s, and sets
       `Cache-Control: no-cache` and `X-Accel-Buffering: no`.
    Events carry no `id:` field in the MVP. Resolved alerts stay in the feed as
    upserts with `status: resolved`; `alert.remove` is for alerts that leave the
    scope (deleted, expired, moved to another team).

    ## Config writes (rules, preferences, teams)
    Every config object carries a `revision`. Writes send it back as
    `expected_revision` and get `409 revision_conflict` (with `error.current`,
    the object as it is now) if someone else saved first. A recreated rule
    gets a higher revision than the deleted rule with the same ID. Validation failures
    are `422 invalid` with `error.details: [{path, message}]`, where `path` is
    a dotted path into the submitted object (`when.all.0.value`). Spec §4.6:
    API edits and YAML imports go through one validator. Until config moves to
    Postgres (M2), only the UI mock implements writes to people and teams.

    ## Runbooks and approvals
    `AlertDetail.runbook` carries per-step state for this alert. Running an
    action step returns `202 {execution_id}`; the action runs off the alert
    pipeline. A step that needs approval returns `409 approval_required` with
    `error.approval_id`, and the request appears on the step. Approving is one
    transaction: consume the request, audit, insert the execution. Runbook
    activity should bump the alert `version` (so open detail panes refetch);
    the UI also polls the detail every 2 s while a step is queued, running or
    awaiting approval.
servers:
  - url: /
paths:
  /api/session:
    get:
      operationId: getSession
      summary: Current user, visible teams and the CSRF token
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
  /api/alerts:
    get:
      operationId: listAlerts
      summary: Feed page (keyset, newest first)
      description: |
        The same projection the stream's `snapshot` carries. Filters are
        optional and combine with AND; a repeated parameter means OR within
        that filter (`status=open&status=acked`).
      parameters:
        - $ref: '#/components/parameters/Team'
        - $ref: '#/components/parameters/Recipient'
        - name: status
          in: query
          schema: { type: array, items: { $ref: '#/components/schemas/AlertStatus' } }
          style: form
          explode: true
        - name: severity
          in: query
          schema: { type: array, items: { $ref: '#/components/schemas/Severity' } }
          style: form
          explode: true
        - name: rule
          in: query
          description: Rule id(s).
          schema: { type: array, items: { type: string } }
          style: form
          explode: true
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 5000, default: 500 }
        - name: cursor
          in: query
          description: Opaque `next_cursor` from a previous page (older rows).
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FeedPage' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /api/alerts/{id}:
    get:
      operationId: getAlert
      summary: Alert detail
      parameters: [ { $ref: '#/components/parameters/AlertId' } ]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AlertDetail' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /api/alerts/{id}/ack:
    post:
      operationId: ackAlert
      summary: Acknowledge (open → acked)
      description: |
        Idempotent: acking an already acked alert returns 200 with the current
        state. Acking a resolved alert is `409 invalid_transition`.
      parameters: [ { $ref: '#/components/parameters/AlertId' }, { $ref: '#/components/parameters/Csrf' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TransitionRequest' }
      responses:
        '200': { $ref: '#/components/responses/Alert' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/alerts/{id}/resolve:
    post:
      operationId: resolveAlert
      summary: Resolve (open | acked → resolved)
      description: Idempotent on an already resolved alert.
      parameters: [ { $ref: '#/components/parameters/AlertId' }, { $ref: '#/components/parameters/Csrf' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TransitionRequest' }
      responses:
        '200': { $ref: '#/components/responses/Alert' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/stream:
    get:
      operationId: streamAlerts
      summary: 'SSE: snapshot | alert.upsert | alert.remove'
      description: |
        `text/event-stream`. See the protocol in the description at the top.
        Event names and the JSON in each `data:` line:
        - `snapshot` → `SnapshotEvent`
        - `alert.upsert` → `FeedAlert`
        - `alert.remove` → `RemoveEvent`
        Later (not M0): `delivery.updated`, `approval.requested`. Clients must
        ignore event names they don't know.
      parameters: [ { $ref: '#/components/parameters/Team' }, { $ref: '#/components/parameters/Recipient' } ]
      responses:
        '200':
          description: Event stream
          content:
            text/event-stream:
              schema: { type: string }
              examples:
                basic:
                  externalValue: ./fixtures/stream-basic.sse
  /api/alerts/{id}/steps/{step}/run:
    post:
      operationId: runStep
      summary: Run a runbook action step (owning team member or admin)
      parameters: [ { $ref: '#/components/parameters/AlertId' }, { $ref: '#/components/parameters/StepId' }, { $ref: '#/components/parameters/Csrf' } ]
      requestBody:
        content:
          application/json:
            schema: { type: object, properties: { expected_version: { type: integer } } }
      responses:
        '202':
          description: Execution queued
          content:
            application/json:
              schema: { type: object, required: [execution_id], properties: { execution_id: { type: string } } }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409':
          description: |
            `approval_required` (with `error.approval_id`; the request now shows on the step),
            or `invalid_transition` (alert resolved, step locked or already running).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
  /api/alerts/{id}/steps/{step}/check:
    post:
      operationId: checkStep
      summary: Tick or untick a manual step (owning team member or admin)
      parameters: [ { $ref: '#/components/parameters/AlertId' }, { $ref: '#/components/parameters/StepId' }, { $ref: '#/components/parameters/Csrf' } ]
      requestBody:
        content:
          application/json:
            schema: { type: object, properties: { done: { type: boolean, default: true } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object } } } }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /api/approvals/{id}/{decision}:
    post:
      operationId: decideApproval
      summary: Approve or reject a pending approval request
      description: Approve consumes the request and starts the execution (returns its id). Eligible approver only; requester cannot self-approve.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: decision, in: path, required: true, schema: { type: string, enum: [approve, reject] } }
        - { $ref: '#/components/parameters/Csrf' }
      requestBody:
        content:
          application/json:
            schema: { type: object, properties: { note: { type: string, maxLength: 2000 } } }
      responses:
        '200':
          description: Decided
          content:
            application/json:
              schema: { type: object, properties: { execution_id: { type: string } } }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /api/rules:
    get:
      operationId: listRules
      summary: Rules with fire counts (scoped to authorized teams)
      parameters: [ { $ref: '#/components/parameters/Team' } ]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/RuleItem' } } } }
        '403': { $ref: '#/components/responses/Error' }
    post:
      operationId: createRule
      summary: Publish a new rule (owning team member or admin)
      parameters: [ { $ref: '#/components/parameters/Csrf' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [rule], properties: { rule: { $ref: '#/components/schemas/RuleSpec' } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/RuleItem' } } } }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /api/rules/{ruleId}:
    parameters: [ { name: ruleId, in: path, required: true, schema: { type: string } } ]
    get:
      operationId: getRule
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/RuleItem' } } } }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    put:
      operationId: updateRule
      summary: Publish a new revision (compare-and-set; owning team member or admin)
      parameters: [ { $ref: '#/components/parameters/Csrf' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rule, expected_revision]
              properties: { rule: { $ref: '#/components/schemas/RuleSpec' }, expected_revision: { type: integer } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/RuleItem' } } } }
        '403': { $ref: '#/components/responses/Error' }
        '409': { description: '`revision_conflict`, `error.current` is the RuleItem now', content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '422': { $ref: '#/components/responses/Error' }
    delete:
      operationId: deleteRule
      summary: Delete a rule (owning team member or admin)
      parameters: [ { $ref: '#/components/parameters/Csrf' }, { name: expected_revision, in: query, required: true, schema: { type: integer } } ]
      responses:
        '200': { description: Deleted, content: { application/json: { schema: { type: object, properties: { deleted: { type: string } } } } } }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /api/rules/test:
    post:
      operationId: testRule
      summary: Dry-run a draft rule against one event (zero writes, zero dispatches)
      description: Same compiler as publish. Bounded payload size and linear-time regex evaluation. The UI debounces calls and drops stale responses.
      parameters: [ { $ref: '#/components/parameters/Csrf' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rule, event]
              properties:
                rule: { $ref: '#/components/schemas/RuleSpec' }
                event: { description: Raw event JSON, any shape }
                source: { type: string, examples: ['kafka:workflows'] }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/RuleTestResult' } } } }
        '403': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
  /api/sources:
    get:
      operationId: listSources
      summary: Configured and observed event sources with activity
      responses:
        '200':
          description: Visible sources
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/SourceView' } }
  /api/schemas/discovered:
    get:
      operationId: listDiscoveredSchemas
      summary: Most recent unknown event shapes with a redacted sample
      responses:
        '200':
          description: Up to 50 entries, newest first
          content:
            application/json:
              schema: { type: array, maxItems: 50, items: { $ref: '#/components/schemas/DiscoveredSchema' } }
  /api/schemas:
    get:
      operationId: listSchemaMappings
      summary: Published schema mappings visible to the session
      responses:
        '200':
          description: Published schema mappings
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/SchemaMapping' } }
    post:
      operationId: publishSchemaMapping
      summary: Create or publish a new revision of a schema mapping (requires team membership; sensitive source paths are redacted)
      parameters: [ { $ref: '#/components/parameters/Csrf' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [spec]
              properties:
                spec: { $ref: '#/components/schemas/SchemaSpec' }
                expected_revision: { type: integer, description: Omit for a new mapping }
                schema: { type: string, description: "Name of the mapping being edited; required with expected_revision, and must equal spec.schema (mappings can't be renamed)" }
      responses:
        '200': { $ref: '#/components/responses/SchemaMapping' }
        '201': { $ref: '#/components/responses/SchemaMapping' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Error' }
  /api/schemas/preview:
    post:
      operationId: previewSchemaMapping
      summary: Evaluate a mapping against one event without changing config
      parameters: [ { $ref: '#/components/parameters/Csrf' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [spec, event, source]
              properties:
                spec: { $ref: '#/components/schemas/SchemaSpec' }
                event: { description: Raw event JSON }
                source: { type: string }
      responses:
        '200':
          description: Detector result, extracted fields, and conversion warnings
          content:
            application/json:
              schema:
                type: object
                required: [matched, fields, warnings]
                properties:
                  matched: { type: boolean }
                  fields: { type: object }
                  warnings: { type: array, items: { type: string } }
        '422': { $ref: '#/components/responses/Error' }
  /api/schemas/suggest:
    post:
      operationId: suggestSchemaMapping
      summary: Propose a schema mapping for an unknown shape or a pasted event (off by default; nothing is stored)
      description: >-
        The model sees only the payload's paths, value types and short redacted
        examples, and can only pick existing paths and approved transforms. An
        admin reviews and edits the result, then publishes it with POST /api/schemas.
      parameters: [ { $ref: '#/components/parameters/Csrf' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  required: [schema]
                  properties: { schema: { type: string, description: '`unknown:<sig>`; uses its latest redacted sample' } }
                - type: object
                  required: [event]
                  properties: { event: { type: object }, source: { type: string } }
      responses:
        '200':
          description: The proposed mapping and its preview against the sample
          content:
            application/json:
              schema:
                type: object
                required: [provider, model, spec, preview, notes]
                properties:
                  provider: { type: string, examples: [mock, claude], description: The UI labels `mock` as "Mock suggestion" }
                  model: { type: [string, 'null'] }
                  spec: { $ref: '#/components/schemas/SchemaSpec' }
                  preview:
                    type: object
                    required: [matched, fields, warnings]
                    properties:
                      matched: { type: boolean }
                      fields: { type: object }
                      warnings: { type: array, items: { type: string } }
                  notes: { type: string }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /api/runbooks:
    get:
      operationId: listRunbooks
      summary: Runbooks visible to the session's authorized teams
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/RunbookSummary' }
    post:
      operationId: publishRunbook
      summary: Publish a previewed runbook with its edited checklist
      parameters: [ { $ref: '#/components/parameters/Csrf' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - { $ref: '#/components/schemas/RunbookImport' }
                - { $ref: '#/components/schemas/RunbookPreview' }
      responses:
        '201':
          description: Saved runbook
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RunbookSummary' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Error' }
  /api/runbooks/{id}:
    get:
      operationId: getRunbook
      summary: A runbook's current revision as templates (for post-incident diffs against an alert's frozen copy)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RunbookDetail' }
        '404': { $ref: '#/components/responses/Error' }
  /api/runbooks/import:
    post:
      operationId: previewRunbookImport
      summary: Preview an explicitly selected format without publishing
      parameters: [ { $ref: '#/components/parameters/Csrf' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RunbookImport' }
      responses:
        '200':
          description: Preview checklist
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RunbookPreview' }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /api/simulator/messages:
    get:
      operationId: listSimulatorMessages
      summary: SMS and phone receipts from the development gateway (dev/demo only; approval challenges restricted to team members)
      parameters:
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        '200':
          description: Receipt page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SimulatorPage' }
  /api/simulator/stream:
    get:
      operationId: streamSimulatorMessages
      summary: Live SMS and phone receipts (dev/demo only; Cache-Control no-store)
      description: SSE emits a snapshot with a SimulatorPage followed by simulator.message events with a SimulatorMessage. Must not be exposed in production deployments.
      responses:
        '200':
          description: Event stream
          content:
            text/event-stream:
              schema: { type: string }
  /api/simulator/reply:
    post:
      operationId: replyFromSimulator
      summary: Send an approval reply from a simulated device (dev/demo only; rate-limited and team-scoped)
      description: Development/demo gateway only (must not be exposed in production). The gateway forwards a reply from the SMS recipient to the signed delivery callback. The service applies team authorization, approval eligibility, expiry, constant-time code verification, and attempt limits.
      parameters: [ { $ref: '#/components/parameters/Csrf' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [from, text]
              properties:
                from: { type: string, examples: ['+447700900125'] }
                text: { type: string, maxLength: 160, examples: ['Y 1234'] }
                receipt_id: { type: string, description: Mock only. Binds the reply to the selected receipt. }
      responses:
        '200':
          description: Reply applied
          content:
            application/json:
              schema:
                type: object
                required: [outcome]
                properties:
                  outcome: { type: string, enum: [approved, rejected, acked, already_decided, wrong_code, too_many_attempts, unknown] }
                  approval_id: { type: string }
                  execution_id: { type: string }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /api/events/recent:
    get:
      operationId: recentEvents
      summary: Recently ingested events the session may see, redacted server-side (test panel samples)
      parameters:
        - $ref: '#/components/parameters/Team'
        - { name: limit, in: query, schema: { type: integer, maximum: 50, default: 20 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      allOf:
                        - { $ref: '#/components/schemas/EventSample' }
                        - { type: object, required: [source, schema], properties: { source: { type: string }, schema: { type: string } } }
        '403': { $ref: '#/components/responses/Error' }
  /api/people/directory:
    get:
      operationId: listDirectory
      summary: Minimal user directory (id, name, teams) for recipient pickers — no contact PII or schedules
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/PersonDirectoryEntry' }
  /api/people:
    get:
      operationId: listPeople
      summary: People visible to the session (contact details and personal schedules omitted/redacted for other users unless admin)
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/PersonView' } } } } } } }
  /api/people/{personId}/preferences:
    put:
      operationId: savePreferences
      summary: Update a person's notification preferences (self or admin only)
      parameters: [ { name: personId, in: path, required: true, schema: { type: string } }, { $ref: '#/components/parameters/Csrf' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [preferences, expected_revision]
              properties:
                preferences: { type: array, items: { $ref: '#/components/schemas/Preference' } }
                expected_revision: { type: integer }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/PersonView' } } } }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /api/teams:
    get:
      operationId: listTeams
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/TeamView' } } } } } } }
  /api/teams/{teamId}:
    put:
      operationId: saveTeam
      summary: Update team membership, lead, on-call rotation and defaults (team lead or admin only)
      parameters: [ { name: teamId, in: path, required: true, schema: { type: string } }, { $ref: '#/components/parameters/Csrf' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expected_revision]
              properties:
                members: { type: array, items: { type: string } }
                lead: { type: [string, 'null'] }
                oncall: { type: object, additionalProperties: { type: array, items: { type: string } } }
                default_channels: { type: array, items: { type: string } }
                expected_revision: { type: integer }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/TeamView' } } } }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /api/proposals:
    get:
      operationId: listProposals
      summary: Proposals scoped to the session's authorized teams (newest first)
      parameters:
        - $ref: '#/components/parameters/Team'
        - name: state
          in: query
          schema: { type: string, enum: [pending, accepted, rejected, stale] }
      responses:
        '200': { description: Newest first, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/Proposal' } } } } } } }
        '403': { $ref: '#/components/responses/Error' }
    post:
      operationId: createProposal
      summary: Suggest a change to a rule (typed, against its current revision)
      parameters: [ { $ref: '#/components/parameters/Csrf' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rule_id, base_revision, kind, summary, proposed_rule]
              properties:
                rule_id: { type: string }
                base_revision: { type: integer }
                kind: { type: string, enum: [noisy, reroute, template, other] }
                summary: { type: string, maxLength: 200 }
                note: { type: string, maxLength: 4000 }
                proposed_rule: { $ref: '#/components/schemas/RuleSpec' }
                alert_id: { type: string }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Proposal' } } } }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /api/proposals/count:
    get:
      operationId: countPendingProposals
      summary: Lightweight count of pending proposals visible to the session (avoids downloading full proposal payloads for nav badges)
      parameters: [ { $ref: '#/components/parameters/Team' } ]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: object, required: [pending], properties: { pending: { type: integer, minimum: 0 } } }
        '403': { $ref: '#/components/responses/Error' }
  /api/proposals/{proposalId}/{decision}:
    post:
      operationId: decideProposal
      summary: Accept (= publish against base_revision) or reject (owning team member or admin)
      description: If the rule moved past `base_revision`, accept is `409 revision_conflict` and the proposal becomes `stale`.
      parameters:
        - { name: proposalId, in: path, required: true, schema: { type: string } }
        - { name: decision, in: path, required: true, schema: { type: string, enum: [accept, reject] } }
        - { $ref: '#/components/parameters/Csrf' }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Proposal' } } } }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
components:
  parameters:
    Recipient:
      name: recipient
      in: query
      description: User id without the user prefix. Selects alerts with this planned recipient. Available when the session advertises recipient_feed.
      schema: { type: string }
    Team:
      name: team
      in: query
      description: Team id. Omitted = every team the session can see.
      schema: { type: string }
    AlertId:
      name: id
      in: path
      required: true
      schema: { type: string }
    StepId:
      name: step
      in: path
      required: true
      schema: { type: string }
    Csrf:
      name: X-CSRF-Token
      in: header
      required: true
      schema: { type: string }
  responses:
    SchemaMapping:
      description: Published schema mapping
      content:
        application/json:
          schema: { $ref: '#/components/schemas/SchemaMapping' }
    Alert:
      description: The alert after the transition
      content:
        application/json:
          schema: { $ref: '#/components/schemas/FeedAlert' }
    Error:
      description: Error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    Conflict:
      description: |
        `version_conflict`: the alert's status changed after
        `expected_version` (count-only bumps never conflict).
        `invalid_transition`: e.g. ack on a resolved alert.
        Both include `error.current`, the alert as it is now.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
  schemas:
    SourceView:
      type: object
      required: [id, type, kind, last_seen, events_24h]
      properties:
        id: { type: string }
        type: { type: string }
        kind: { type: string, enum: [http, kafka, file, poll] }
        topics: { type: array, items: { type: string } }
        last_seen: { type: [string, 'null'], format: date-time }
        events_24h: { type: integer, minimum: 0 }
    DiscoveredSchema:
      type: object
      required: [schema, source, count, first_seen, last_seen, sample]
      properties:
        schema: { type: string }
        source: { type: string }
        count: { type: integer, minimum: 1 }
        first_seen: { $ref: '#/components/schemas/Timestamp' }
        last_seen: { $ref: '#/components/schemas/Timestamp' }
        sample: { description: Redacted raw event JSON }
    SchemaSpec:
      type: object
      required: [schema, detect]
      properties:
        schema: { type: string }
        priority: { type: integer, default: 0 }
        detect:
          description: Typed condition with payload-relative paths and an optional source restriction.
          allOf:
            - { $ref: '#/components/schemas/Condition' }
            - type: object
              properties:
                source: { type: string }
        fields:
          type: object
          additionalProperties:
            type: object
            properties:
              path: { type: string }
              value: {}
              transform: { type: string, enum: [lower, upper, trim] }
              enum: { type: string, enum: [severity] }
              as: { type: string, enum: [string, number, bool, rfc3339, epoch_ms, epoch_s] }
              equals: {}
    SchemaMapping:
      type: object
      required: [spec, revision]
      properties:
        spec: { $ref: '#/components/schemas/SchemaSpec' }
        revision: { type: integer, minimum: 1 }
    RunbookImport:
      type: object
      required: [format, team, title, content]
      properties:
        format: { type: string, enum: [yaml, markdown, link, text] }
        team: { type: string }
        title: { type: string, maxLength: 120 }
        content: { type: string, maxLength: 65536 }
    RunbookPreview:
      type: object
      required: [id, title, steps]
      properties:
        id: { type: string }
        title: { type: string }
        steps:
          type: array
          maxItems: 50
          items:
            type: object
            required: [id, kind, text]
            properties:
              id: { type: string }
              kind: { type: string, enum: [manual, condition, action] }
              text: { type: string, maxLength: 2000 }
              hint: { type: string }
              approval: { type: string, enum: [none, required] }
              action:
                type: object
                required: [name, label, params, risk]
                properties:
                  name: { type: string }
                  label: { type: string }
                  params: { type: object, additionalProperties: { type: string } }
                  risk: { type: string, enum: [low, high] }
              after_failures:
                type: object
                required: [step, count]
                properties:
                  step: { type: string }
                  count: { type: integer, minimum: 1 }
              resolves: { type: boolean }
    RunbookSummary:
      type: object
      required: [id, title, format, team, steps]
      properties:
        id: { type: string }
        title: { type: string }
        format: { type: string, examples: [yaml, markdown, link, text] }
        team: { type: [string, 'null'] }
        steps: { type: integer, minimum: 0, description: Number of steps }
        revision: { type: integer, minimum: 1, description: Current published revision }
    RunbookDetail:
      type: object
      required: [id, revision, title, format, team, steps]
      properties:
        id: { type: string }
        revision: { type: integer, minimum: 1 }
        title: { type: string }
        format: { type: string, examples: [yaml, markdown, link, text] }
        team: { type: [string, 'null'] }
        steps:
          type: array
          items:
            type: object
            required: [id, kind, text, action, approval]
            properties:
              id: { type: string, description: Stable across revisions }
              kind: { type: string, enum: [manual, condition, action] }
              text: { type: string, description: 'Template, not rendered (an alert''s frozen copy has `{{…}}` filled in)' }
              action:
                oneOf:
                  - type: object
                    required: [name, label]
                    properties: { name: { type: string }, label: { type: string } }
                  - type: 'null'
              approval: { type: string, enum: [none, required], description: Effective value (required for high-risk actions) }
    SimulatorMessage:
      type: object
      required: [id, receipt_id, job_id, alert_id, channel, recipient, to, text, approval_challenge, duplicates, received_at]
      properties:
        id: { type: integer }
        receipt_id: { type: string }
        job_id: { type: string }
        alert_id: { type: string }
        channel: { type: string, enum: [sms, phone] }
        recipient: { type: string }
        to: { type: string }
        text: { type: string }
        approval_challenge: { type: [string, 'null'], description: Visible to the simulated device only }
        duplicates: { type: integer, minimum: 0 }
        received_at: { $ref: '#/components/schemas/Timestamp' }
    SimulatorPage:
      type: object
      required: [items, next_cursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/SimulatorMessage' } }
        next_cursor: { type: [string, 'null'] }
    Severity:
      type: string
      enum: [critical, error, warning, info]
    AlertStatus:
      type: string
      enum: [open, acked, resolved]
    ColorToken:
      type: string
      description: Semantic colour from the rule's `present.color`. Unknown values render grey.
      enum: [red, orange, amber, yellow, green, blue, purple, grey]
    Timestamp:
      type: string
      format: date-time
      examples: ['2026-10-23T09:14:02.331Z']
    RuleRef:
      type: object
      required: [id, revision, name]
      properties:
        id: { type: string, examples: [rates-rejected-trades] }
        revision: { type: integer, description: Rule revision the alert was opened and rendered under }
        name: { type: string }
    AlertField:
      type: object
      required: [path, label, value]
      properties:
        path: { type: string, examples: [raw.payload.desk] }
        label: { type: string, examples: [Desk] }
        value: { type: string, description: Rendered by the backend }
    FeedAlert:
      type: object
      description: The feed projection. Rendered presentation is frozen at the opening rule revision; count, status and timestamps are live.
      required: [id, team, version, rule, status, severity, color, title, body, fields, count, first_seen, last_seen, source, schema, acked_by, acked_at, resolved_by, resolved_at, resolved_reason]
      properties:
        id: { type: string, examples: [alt_01JB3Q8YQ5T0V7] }
        team: { type: string }
        version: { type: integer, minimum: 1 }
        rule: { $ref: '#/components/schemas/RuleRef' }
        status: { $ref: '#/components/schemas/AlertStatus' }
        severity: { $ref: '#/components/schemas/Severity' }
        color: { $ref: '#/components/schemas/ColorToken' }
        title: { type: string, description: Plain text; the UI escapes it }
        body: { type: string, description: Plain text; the UI escapes it }
        fields: { type: array, items: { $ref: '#/components/schemas/AlertField' } }
        count: { type: integer, minimum: 1, description: Dedup counter }
        first_seen: { $ref: '#/components/schemas/Timestamp' }
        last_seen: { $ref: '#/components/schemas/Timestamp' }
        source: { type: string, examples: ['kafka:workflows'] }
        schema: { type: string, examples: [workflow.failed] }
        acked_by: { type: [string, 'null'] }
        acked_at: { oneOf: [ { $ref: '#/components/schemas/Timestamp' }, { type: 'null' } ] }
        resolved_by: { type: [string, 'null'] }
        resolved_at: { oneOf: [ { $ref: '#/components/schemas/Timestamp' }, { type: 'null' } ] }
        resolved_reason: { type: [string, 'null'], examples: [user, recovered, quiet_for] }
    FeedPage:
      type: object
      required: [items, next_cursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/FeedAlert' } }
        next_cursor: { type: [string, 'null'] }
    EventSample:
      type: object
      required: [event_id, received_at, raw]
      properties:
        event_id: { type: string }
        received_at: { $ref: '#/components/schemas/Timestamp' }
        raw: { description: Event payload with secrets and PII redacted server-side }
    TimelineEntry:
      type: object
      required: [at, actor, kind, message]
      properties:
        at: { $ref: '#/components/schemas/Timestamp' }
        actor: { type: string, examples: ['user:erop', system] }
        kind:
          type: string
          description: Open set; render unknown kinds generically.
          examples: [opened, deduplicated, acked, resolved, reopened, notified, step_run, approval, comment]
        message: { type: string }
    RunbookView:
      type: object
      description: The runbook selected for this alert (spec §6.1), with per-step state for this alert instance.
      required: [id, revision, title, format, url, text, steps]
      properties:
        id: { type: string }
        revision: { type: integer }
        title: { type: string }
        format: { type: string, examples: [yaml, markdown, link, text] }
        url: { type: [string, 'null'], description: '`link` runbooks; the UI only opens http(s)' }
        text: { type: [string, 'null'], description: '`text`/`markdown` original, verbatim' }
        steps: { type: array, items: { $ref: '#/components/schemas/RunbookStep' } }
    RunbookStep:
      type: object
      required: [id, kind, text, hint, action, approval, state, disabled_reason, done_by, done_at, runs, approval_request]
      properties:
        id: { type: string, description: Stable across revisions }
        kind: { type: string, enum: [manual, condition, action] }
        text: { type: string, description: Rendered from the pinned event context }
        hint: { type: [string, 'null'], description: Guidance shown but not enforced }
        action:
          oneOf:
            - type: 'null'
            - type: object
              required: [name, label, params, risk]
              properties:
                name: { type: string, examples: [http_get, retry_workflow, escalate, restart_service] }
                label: { type: string }
                params: { type: object, additionalProperties: { type: string }, description: Rendered, secrets redacted }
                risk: { type: string, enum: [low, high] }
        approval: { type: string, enum: [none, required] }
        state: { type: string, examples: [idle, done, queued, running, ok, failed, uncertain, cancelled, awaiting_approval, rejected] }
        disabled_reason: { type: [string, 'null'], examples: ['Available after 2 failed retries (1 so far)'] }
        done_by: { type: [string, 'null'] }
        done_at: { oneOf: [ { $ref: '#/components/schemas/Timestamp' }, { type: 'null' } ] }
        runs: { type: array, items: { $ref: '#/components/schemas/Execution' }, description: Oldest first }
        approval_request: { oneOf: [ { $ref: '#/components/schemas/ApprovalRequest' }, { type: 'null' } ] }
    Execution:
      type: object
      required: [id, state, requested_by, started_at, finished_at, output]
      properties:
        id: { type: string }
        state: { type: string, enum: [queued, running, ok, failed, uncertain, cancelled] }
        requested_by: { type: string }
        started_at: { type: [string, 'null'] }
        finished_at: { type: [string, 'null'] }
        output: { type: [string, 'null'], description: Short, redacted }
    ApprovalRequest:
      type: object
      required: [id, state, requested_by, requested_at, expires_at, eligible, can_decide, decided_by, decided_at, note]
      properties:
        id: { type: string }
        state: { type: string, enum: [pending, approved, rejected, expired] }
        requested_by: { type: string }
        requested_at: { $ref: '#/components/schemas/Timestamp' }
        expires_at: { $ref: '#/components/schemas/Timestamp' }
        eligible: { type: array, items: { type: string }, examples: [['user:carol']] }
        can_decide: { type: boolean, description: Whether the session user is eligible to decide (excludes requester self-approval) }
        sms_sent: { type: boolean, description: Whether an out-of-band SMS challenge was sent to eligible approvers (plaintext code is never returned) }
        decided_by: { type: [string, 'null'] }
        decided_at: { type: [string, 'null'] }
        note: { type: [string, 'null'] }
    DeliveryStatus:
      type: object
      description: |
        One `delivery_jobs` row for the alert (proposed by delivery, board #63);
        beacon-api reads them with one SELECT ... WHERE alert_id. `cancelled`
        means the alert was acked/resolved before the send. Channels and states
        are open sets; clients render unknown values generically.
      required: [id, recipient, channel, address, state, attempts, last_error, sent_at, updated_at]
      properties:
        id: { type: string, description: Delivery job id }
        recipient: { type: string, examples: ['user:anna'] }
        channel: { type: string, examples: [email, sms, phone, ui] }
        address: { type: string, description: Masked destination address to avoid broadcasting personal contact PII, examples: ['a***@example.test', '+44 •••• ••0123'] }
        state:
          type: string
          examples: [pending, in_flight, sent, cancelled, dead]
        attempts: { type: integer, minimum: 0 }
        last_error: { type: [string, 'null'] }
        sent_at: { oneOf: [ { $ref: '#/components/schemas/Timestamp' }, { type: 'null' } ] }
        updated_at: { $ref: '#/components/schemas/Timestamp' }
    AlertDetail:
      allOf:
        - { $ref: '#/components/schemas/FeedAlert' }
        - type: object
          required: [samples, runbook, deliveries, timeline]
          properties:
            samples: { type: array, items: { $ref: '#/components/schemas/EventSample' } }
            runbook: { oneOf: [ { $ref: '#/components/schemas/RunbookView' }, { type: 'null' } ] }
            deliveries: { type: array, items: { $ref: '#/components/schemas/DeliveryStatus' } }
            timeline: { type: array, items: { $ref: '#/components/schemas/TimelineEntry' } }
            occurrences:
              type: object
              required: [from, bucket_seconds, counts]
              properties:
                from: { $ref: '#/components/schemas/Timestamp' }
                bucket_seconds: { type: integer, minimum: 1 }
                counts: { type: array, maxItems: 24, items: { type: integer, minimum: 0 } }
    TransitionRequest:
      type: object
      required: [expected_version]
      properties:
        expected_version: { type: integer }
        note: { type: string, maxLength: 2000 }
    ApiError:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              examples: [version_conflict, invalid_transition, revision_conflict, approval_required, invalid, not_found, forbidden, csrf, bad_request, internal]
            message: { type: string }
            current: { description: 'The object as it is now: FeedAlert for alert transitions; RuleItem, PersonView or TeamView for config writes' }
            approval_id: { type: string, description: '`approval_required` only' }
            details:
              type: array
              description: '`invalid` only'
              items: { type: object, required: [path, message], properties: { path: { type: string }, message: { type: string } } }
    Session:
      type: object
      required: [user, teams, csrf_token]
      properties:
        user:
          type: object
          required: [id, name]
          properties: { id: { type: string }, name: { type: string } }
        teams:
          type: array
          items:
            type: object
            required: [id, name]
            properties: { id: { type: string }, name: { type: string } }
        csrf_token: { type: string }
        capabilities:
          type: object
          properties:
            recipient_feed: { type: boolean, description: Supports recipient scope on both feed endpoints }
            mock_transports: { type: boolean, description: Accepts fixture broker and log events through the mock ingest endpoint }
            runbook_import: { type: boolean, description: Supports runbook preview and publication }
            llm_suggest: { type: boolean, description: 'POST /api/schemas/suggest is enabled (BEACON_LLM=mock|claude; off by default)' }
    SnapshotEvent:
      type: object
      required: [team, items, next_cursor, server_time]
      properties:
        team: { type: [string, 'null'] }
        items: { type: array, items: { $ref: '#/components/schemas/FeedAlert' } }
        next_cursor: { type: [string, 'null'] }
        server_time: { $ref: '#/components/schemas/Timestamp' }
    RemoveEvent:
      type: object
      required: [id, version, reason]
      properties:
        id: { type: string }
        version: { type: integer }
        reason: { type: string, enum: [deleted, out_of_scope, expired] }
    Condition:
      description: 'Typed condition tree (spec §4.3). Missing values compare false; `not` negates.'
      oneOf:
        - { type: object, required: [all], properties: { all: { type: array, items: { $ref: '#/components/schemas/Condition' } } } }
        - { type: object, required: [any], properties: { any: { type: array, items: { $ref: '#/components/schemas/Condition' } } } }
        - { type: object, required: [not], properties: { not: { $ref: '#/components/schemas/Condition' } } }
        - type: object
          required: [path, op]
          properties:
            path: { type: string, examples: [raw.payload.notional, fields.severity, schema, source] }
            op: { type: string, enum: [eq, neq, gt, gte, lt, lte, in, not_in, contains, starts_with, regex, exists, not_exists] }
            value: { description: 'Scalar, or a list for in/not_in; omitted for exists/not_exists' }
    RuleSpec:
      type: object
      description: The JSON form of `config/rules/*.yaml`. Unknown keys are inert; prototype-pollution keys (`__proto__`, `constructor`, `prototype`) are forbidden.
      required: [id, team, when, route, present]
      additionalProperties: true
      properties:
        id: { type: string, pattern: '^[a-z0-9][a-z0-9-]{1,62}$' }
        name: { type: string }
        team: { type: string }
        enabled: { type: boolean, default: true }
        when: { $ref: '#/components/schemas/Condition' }
        severity: { $ref: '#/components/schemas/Severity', description: "Omitted = the event's fields.severity" }
        route:
          type: array
          minItems: 1
          items:
            type: object
            required: [to]
            properties:
              to: { type: string, examples: ['team:rates', 'user:anna', 'oncall:settlements'] }
              channels: { type: array, items: { type: string }, description: Omitted = recipient preferences }
        present:
          type: object
          required: [title]
          properties:
            title: { type: string }
            body: { type: string }
            fields: { type: array, items: { oneOf: [ { type: string }, { type: object, required: [path, label], properties: { path: { type: string }, label: { type: string } } } ] } }
            color: { $ref: '#/components/schemas/ColorToken' }
        dedup: { type: object, properties: { key: { type: array, items: { type: string } }, window: { type: string, examples: [10m] } } }
        group: { type: object, properties: { by: { type: array, items: { type: string } }, window: { type: [string, integer] } } }
        throttle: { type: object, properties: { max: { type: integer }, per: { type: string } } }
        runbook: { type: string }
        auto_resolve: { type: object, properties: { recover_when: { $ref: '#/components/schemas/Condition' }, quiet_for: { type: string } } }
        escalate_after: { type: string }
    RuleItem:
      type: object
      required: [rule, revision, updated_at, updated_by, stats]
      properties:
        rule: { $ref: '#/components/schemas/RuleSpec' }
        revision: { type: integer, description: 'Send back as expected_revision' }
        updated_at: { $ref: '#/components/schemas/Timestamp' }
        updated_by: { type: string, examples: ['user:erop', config] }
        stats:
          type: object
          required: [fires_24h, open_alerts, last_fired_at, hourly]
          properties:
            fires_24h: { type: integer }
            open_alerts: { type: integer }
            last_fired_at: { type: [string, 'null'] }
            hourly: { type: array, items: { type: integer }, minItems: 24, maxItems: 24, description: Matching events per hour, oldest first }
        can_edit: { type: boolean, description: Whether the session user may edit or delete this rule }
    RuleTestResult:
      type: object
      required: [matched, schema, fields, nodes, card, warnings, errors]
      properties:
        matched: { type: boolean }
        schema: { type: string, description: Detected schema or unknown:<signature> }
        fields: { type: object, description: Normalized fields as the rule sees them }
        nodes:
          type: array
          items:
            type: object
            required: [node, result]
            properties:
              node: { type: string, description: 'Child indexes from the root, dot-separated; "" = root. A not wraps its child at index 0.' }
              result: { type: string, enum: [match, no_match, skipped, error] }
              actual: { description: The value at the leaf path; absent when missing }
              message: { type: string }
        card:
          oneOf:
            - type: 'null'
            - type: object
              required: [title, body, severity, color, fields, dedup_key]
              properties:
                title: { type: string }
                body: { type: string }
                severity: { $ref: '#/components/schemas/Severity' }
                color: { $ref: '#/components/schemas/ColorToken' }
                fields: { type: array, items: { $ref: '#/components/schemas/AlertField' } }
                dedup_key: { type: array, items: { type: string } }
        warnings: { type: array, items: { type: string } }
        errors: { type: array, items: { type: object, required: [path, message], properties: { path: { type: string }, message: { type: string } } } }
    Preference:
      description: One line of a person's preferences; the first match wins (spec §4.4). A `default` line goes last.
      oneOf:
        - type: object
          required: [default]
          properties: { default: { type: array, items: { type: string } } }
        - type: object
          required: [match, channels]
          properties:
            match:
              type: object
              properties:
                severity: { oneOf: [ { $ref: '#/components/schemas/Severity' }, { type: array, items: { $ref: '#/components/schemas/Severity' } } ] }
                service: { type: string }
                team: { type: string }
            channels: { type: array, items: { type: string } }
            when:
              type: object
              required: [between, tz]
              properties:
                between: { type: string, examples: ['08:00-20:00'], description: 'Half-open local window; may wrap midnight' }
                tz: { type: string, examples: [Europe/London] }
            otherwise: { type: array, items: { type: string }, description: 'Outside the window; omitted = skip this line' }
    PersonDirectoryEntry:
      type: object
      required: [id, name, teams]
      properties:
        id: { type: string }
        name: { type: string }
        teams: { type: array, items: { type: string } }
    PersonView:
      type: object
      required: [id, name, contact, teams, preferences, revision]
      properties:
        id: { type: string }
        name: { type: string }
        contact: { type: object, description: Omitted/empty for other users unless authorized, properties: { email: { type: string }, phone: { type: string } } }
        teams: { type: array, items: { type: string } }
        preferences: { type: array, description: Empty/redacted for other users unless authorized, items: { $ref: '#/components/schemas/Preference' } }
        revision: { type: integer }
        can_edit: { type: boolean, description: Whether the session user may view/edit this person's contact details and preferences }
    TeamView:
      type: object
      required: [id, name, members, lead, oncall, default_channels, revision]
      properties:
        id: { type: string }
        name: { type: string }
        members: { type: array, items: { type: string } }
        lead: { type: [string, 'null'] }
        oncall: { type: object, additionalProperties: { type: array, items: { type: string } }, description: 'Schedule → rotation; first is on call' }
        default_channels: { type: array, items: { type: string } }
        revision: { type: integer }
        can_edit: { type: boolean, description: Whether the session user (team lead or admin) may edit this team }
    Proposal:
      type: object
      required: [id, rule_id, rule_name, kind, summary, note, base_revision, base_rule, proposed_rule, author, auto, alert_id, created_at, state, decided_by, decided_at]
      properties:
        id: { type: string }
        rule_id: { type: string }
        rule_name: { type: string }
        kind: { type: string, examples: [noisy, reroute, template, other] }
        summary: { type: string }
        note: { type: string }
        base_revision: { type: integer }
        base_rule: { $ref: '#/components/schemas/RuleSpec' }
        proposed_rule: { $ref: '#/components/schemas/RuleSpec' }
        author: { type: string, examples: ['user:erin', system] }
        auto: { type: boolean, description: Suggested by Beacon from how the alerts were handled }
        alert_id: { type: [string, 'null'] }
        created_at: { $ref: '#/components/schemas/Timestamp' }
        state: { type: string, enum: [pending, accepted, rejected, stale] }
        decided_by: { type: [string, 'null'] }
        decided_at: { type: [string, 'null'] }
        can_review: { type: boolean, description: Whether the session user may accept or reject this proposal }
